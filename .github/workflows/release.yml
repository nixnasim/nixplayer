# Push a tag like v1.6.1 and this builds the Windows installer and publishes it
# (installer + latest.yml, which the in-app updater reads) as a GitHub Release of this same repo.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in token create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create the version tag if it does not exist yet
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists"
          else
            git tag "v$V"
            git push origin "v$V"
          fi
      - name: Install dependencies (retries; uses a mirror if GitHub downloads keep failing)
        # ffmpeg-static downloads ffmpeg.exe from GitHub Releases while installing, and that download sometimes
        # answers 504. Try a few times, then try a mirror before giving up.
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..4) {
            npm ci
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "npm ci failed (attempt $i of 4). Waiting before the next try..."
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds (30 * $i)
          }
          if (-not $ok) {
            Write-Host 'Trying the npmmirror mirror for the ffmpeg download'
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
            $env:FFMPEG_BINARIES_URL = 'https://cdn.npmmirror.com/binaries/ffmpeg-static'
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed: GitHub and the mirror are not answering. Run the workflow again in a few minutes.' }
          }
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js
      - name: Create the GitHub Release first (with the CHANGELOG notes)
        # Without this, electron-builder uploads several files at once and GitHub can end up with TWO releases for the same
        # tag (one with latest.yml, one with the installer), which makes the in-app update fail with "404".
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --title "NixPlayer $V" --notes-file release-notes.md
          else
            gh release create "v$V" --title "NixPlayer $V" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub, nothing to create
