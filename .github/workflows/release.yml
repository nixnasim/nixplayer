# Push a tag like v1.6.1 and this builds the Windows installer and publishes it
# (installer + latest.yml, which the in-app updater reads) as a GitHub Release of this same repo.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in token create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create the version tag if it does not exist yet
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists"
          else
            git tag "v$V"
            git push origin "v$V"
          fi
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub, nothing to create
      - name: Put the CHANGELOG notes on the GitHub Release
        continue-on-error: true   # the installer is already published; a notes problem must not fail the release
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          gh release edit "v$V" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
