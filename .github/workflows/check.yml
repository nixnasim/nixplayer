name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every JavaScript file
        run: |
          for f in main.js preload.js av.js webproxy.js updater.js edition.js renderer/*.js; do
            node --check "$f" || exit 1
          done
