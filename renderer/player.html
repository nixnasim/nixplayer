<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NixPlayer</title>
<style>
:root{--ac:#2f7bff;--sz:24px;--sc:#fff;--sb:rgba(0,0,0,.6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}
#stage{position:relative;width:100%;flex:1;min-height:0;background:#000;user-select:none;touch-action:none}
video{width:100%;height:100%;object-fit:contain;display:block}
video::-webkit-media-text-track-container{display:none!important}
/* subtitles are drawn by NixPlayer itself (see #subs) so they sit inside the picture */
#subs{position:absolute;z-index:6;pointer-events:none;display:none;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;overflow:hidden;transition:padding-bottom .18s}
#subs nx-w{pointer-events:auto;cursor:help;border-radius:.12em;transition:background .08s}
#subs nx-w.hov{background:rgba(255,255,255,.28)}#subs nx-w.sel{background:var(--ac);color:#fff;text-shadow:none}
#trtip{position:absolute;z-index:9;display:none;pointer-events:none;background:var(--bg1);color:var(--fgh);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;box-shadow:0 8px 28px rgba(0,0,0,.5);font:14px/1.4 "Nirmala UI","Noto Sans Bengali",system-ui,sans-serif;text-align:left;width:max-content}
#trtip .trs{font-size:12px;opacity:.65;margin-bottom:2px}#trtip .trm{font-size:19px;font-weight:600;color:var(--fgh);white-space:pre-wrap}#trtip .trd{font-size:12.5px;opacity:.85;margin-top:3px}#trtip .trd b{color:var(--ac);font-weight:600;margin-right:2px}
#trtip.pin{pointer-events:auto;cursor:default;min-width:260px;max-width:440px;max-height:calc(100% - 24px);overflow:auto;padding:12px 14px 10px;user-select:text}
#trtip .trx{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--fgh);opacity:.6;cursor:pointer;font-size:16px;line-height:1}#trtip .trx:hover{opacity:1;background:var(--bg3)}
#trtip.pin .trs{padding-right:26px}
#trtip .trk{margin-top:8px;border-top:1px solid var(--bg3);padding-top:6px;display:grid;gap:3px}
#trtip .trk .pos{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);font-weight:700;margin-top:3px}
#trtip .trk .wd{font-size:13.5px;opacity:.92}
#trtip .trt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}#trtip .trt b{font-size:14.5px;font-weight:600}
#trtip .chips{display:flex;flex-wrap:wrap;gap:4px}#trtip .chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg3);color:var(--fg);font-family:system-ui,sans-serif;white-space:nowrap}
#trtip .chip.an{background:rgba(230,70,70,.16);color:#d64545}
#trtip .trw{margin:8px 0 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.6}
#trtip .def{font-size:13.5px;margin-top:4px;font-family:system-ui,sans-serif}#trtip .def i{display:block;opacity:.6;font-size:12.5px}
#trtip .lab{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 2px;font-family:system-ui,sans-serif}
#trtip .ph{font-size:13px;opacity:.65;font-family:system-ui,sans-serif;margin-top:1px}
#trtip .tra{display:flex;gap:6px;margin-top:8px;position:sticky;bottom:-10px;padding:8px 0 2px;background:var(--bg1)}
#trtip .tra button{flex:1;border:1px solid var(--bd2);background:var(--bg2);color:var(--fgh);border-radius:7px;padding:5px 8px;font:12.5px system-ui,sans-serif;cursor:pointer}#trtip .tra button:hover{background:var(--bg3)}
#trtip .trh{font-size:11px;opacity:.55;margin-top:5px;text-transform:uppercase;letter-spacing:.04em}#trtip .tre{font-size:13px;color:#ffb4b4}
#subs.top{justify-content:flex-start}
#subs span,.sp-pv span{display:inline-block;max-width:92%;color:var(--sc);font-family:var(--sf,inherit);font-weight:600;line-height:1.25;white-space:pre-wrap;word-break:break-word;background:var(--sb);padding:.05em .4em;border-radius:.15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#subs.ol span,.sp-pv.ol span{text-shadow:0 0 .09em #000,0 0 .09em #000,.055em .055em .06em #000,-.055em .055em .06em #000,.055em -.055em .06em #000,-.055em -.055em .06em #000,0 .07em .08em #000,0 -.07em .08em #000,.07em 0 .08em #000,-.07em 0 .08em #000}
/* ---------- home screen (empty state): themed, light + dark ---------- */
:root{--hbg:#0d0e2e;--hbg2:#15174a;--hglow1:rgba(37,184,214,.20);--hglow2:rgba(106,88,184,.28);--hfg:#e8eaff;--hfg2:#9ea2cf;--hfg3:#7478ad;--hcard:rgba(255,255,255,.045);--hcardb:rgba(150,160,255,.22);--hghost:rgba(255,255,255,.07);--hghostt:#d6d9f7;--hkbd:rgba(255,255,255,.07);--hkbdb:rgba(150,160,255,.28);--hshadow:0 20px 60px rgba(0,0,0,.45);--htitle:linear-gradient(90deg,#3fd0ea,#7c8cf0 60%,#8a70d8);--htile:#12143d;--hgrad:linear-gradient(135deg,#25b8d6,#5a4fb0)}
:root[data-theme=light]{--hbg:#f4f6ff;--hbg2:#e6eafd;--hglow1:rgba(37,184,214,.22);--hglow2:rgba(106,88,184,.16);--hfg:#14163f;--hfg2:#4f5486;--hfg3:#7d82ae;--hcard:rgba(255,255,255,.72);--hcardb:rgba(90,79,176,.28);--hghost:#fff;--hghostt:#3a3f7a;--hkbd:#fff;--hkbdb:#cfd3ef;--hshadow:0 20px 50px rgba(60,60,140,.14);--htitle:linear-gradient(90deg,#14a5c6,#4a5fc4 60%,#5a4fb0);--htile:#fff}
#empty{position:absolute;inset:0;display:flex;overflow:auto;text-align:center;color:var(--hfg);font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse 70% 60% at 50% 38%,var(--hbg2),var(--hbg) 70%)}
#empty::before{content:'';position:absolute;width:900px;height:900px;left:50%;top:36%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--hglow1),var(--hglow2) 45%,transparent 70%);pointer-events:none}
#empty .eh{position:relative;z-index:2;margin:auto;padding:28px 20px;display:flex;flex-direction:column;align-items:center;width:100%}
#empty .tile{width:104px;height:104px;border-radius:26px;background:var(--htile);display:grid;place-items:center;box-shadow:0 14px 44px rgba(37,184,214,.28),0 0 0 1px var(--hcardb);pointer-events:none}
#empty .tile img{width:78px}
#empty .en{margin-top:16px;font-size:38px;font-weight:800;letter-spacing:-.01em;background:var(--htitle);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none}
#empty .tag{margin-top:2px;font-size:15px;color:var(--hfg2);letter-spacing:.14em;text-transform:uppercase;font-weight:500;pointer-events:none}
#empty .drop{margin-top:30px;width:min(620px,94%);height:170px;border-radius:24px;border:2px dashed var(--hcardb);background:var(--hcard);box-shadow:var(--hshadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:border-color .15s,transform .15s}
#empty .drop:hover{border-color:#25b8d6;transform:translateY(-1px)}
#empty .drop .ic{width:48px;height:48px;border-radius:50%;background:var(--hgrad);display:grid;place-items:center;box-shadow:0 8px 22px rgba(37,184,214,.35);margin-bottom:5px}
#empty .drop b{font-size:17px;font-weight:600;color:var(--hfg)}
#empty .em{font-size:13px;color:var(--hfg3);padding:0 16px}
#empty .eb{display:flex;gap:12px;margin-top:20px}
#empty .eb button{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:12px 26px;font:600 14px Inter,"Segoe UI",system-ui,sans-serif;cursor:pointer;color:#fff;background:var(--hgrad);box-shadow:0 8px 22px rgba(70,90,200,.35);transition:filter .15s,transform .15s}
#empty .eb button.g{background:var(--hghost);color:var(--hghostt);box-shadow:inset 0 0 0 1px var(--hcardb)}
#empty .eb button:hover{filter:brightness(1.08);transform:translateY(-1px)}
#empty .rec{display:none;margin-top:34px;width:min(1000px,94%);text-align:left}
#empty .rec.on{display:block}
#empty .rec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hfg3);font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
#empty .rec h3 button{border:0;background:none;color:#25b8d6;font:600 13px Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:.02em;text-transform:none;cursor:pointer;padding:0}
#empty .rec h3 button:hover{text-decoration:underline}
#empty .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
#empty .cd{border-radius:16px;background:var(--hcard);box-shadow:inset 0 0 0 1px var(--hcardb);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
#empty .cd:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px #25b8d6}
#empty .cth{height:100px;width:100%;position:relative;display:block;background:linear-gradient(135deg,#2a6f8f,#1b1f5e) center/cover no-repeat}
#empty .cth i{position:absolute;left:0;bottom:0;height:4px;background:var(--hgrad)}
#empty .cth s{position:absolute;right:8px;bottom:10px;font:600 11px Inter,"Segoe UI",sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:5px;text-decoration:none}
#empty .cd p{margin:0;padding:9px 12px 11px;font-size:12.5px;line-height:1.35;color:var(--hfg);overflow:hidden}
#empty .cd p b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty .cd p small{display:block;color:var(--hfg3);font-size:11.5px;margin-top:2px}
#empty .ek{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;margin-top:24px;font-size:12px;color:var(--hfg3);pointer-events:none}
#empty .ek span{display:inline-flex;align-items:center;gap:4px}
#empty kbd{font:600 11px Inter,"Segoe UI",system-ui,sans-serif;color:var(--hghostt);background:var(--hkbd);border:1px solid var(--hkbdb);border-bottom-width:2px;border-radius:5px;padding:1px 7px}
#empty .ek kbd+kbd{margin-left:-2px}
@media (max-height:760px){#empty .rec{display:none!important}}
@media (max-height:540px){#empty .drop,#empty .ek{display:none}}
/* top bar + bottom control bar follow the theme (layout and icons are unchanged) */
:root.home #top,:root.home #bar{--bgx:#15163a;--bdx:#262a5a;--fg:#e4e7ff;--fg2:#b4b9e6;--fg3:#7f84b8;--fgh:#fff;--trk:#2d3166;--bg3:#2d3166;--bd2:#3a3f80}
:root.home[data-theme=light] #top,:root.home[data-theme=light] #bar{--bgx:#f8f9ff;--bdx:#dde1f6;--fg:#1a1d4d;--fg2:#3f4585;--fg3:#7d82ae;--fgh:#0b0d33;--trk:#d3d8f2;--bg3:#d3d8f2;--bd2:#bfc5ea}
.home #top,.home #bar{background:var(--bgx)!important;border-color:var(--bdx)!important}
/* only on the home screen; while a video is open the bars use the normal grey light / dark look */
.home #top::after,.home #bar::before{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#25b8d6,#5a4fb0,transparent);opacity:.55;pointer-events:none}
.home #top::after{bottom:-1px}.home #bar::before{top:-1px}
#hud{position:absolute;top:14px;left:14px;z-index:15;display:flex;align-items:center;gap:9px;color:#fff;background:rgba(18,18,18,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 13px 7px 11px;border-radius:9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
#hud.show{opacity:1;transform:none}#hud .ic{width:18px;height:18px;color:var(--ac)}
#hud .hb{width:84px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}#hud .hb b{display:block;height:100%;background:var(--ac);border-radius:2px}
#mb{position:absolute;top:62px;left:14px;z-index:15;width:34px;height:34px;border-radius:9px;background:rgba(18,18,18,.8);color:#ff6b5e;display:none;align-items:center;justify-content:center;pointer-events:none}
#bar{position:relative;flex:none;z-index:12;padding:4px 10px 6px;background:var(--bg1);border-top:1px solid var(--bd);transition:opacity .25s}
/* the controls sit below the picture and never cover it; only with auto-hide on, or in fullscreen, they float over it */
body.ah #bar,body.full #bar{position:fixed;left:0;right:0;bottom:0}
body.ah.idle #bar,body.full.idle #bar{opacity:0}.idle{cursor:none}
body.ah #pop,body.full #pop{bottom:76px}
/* playlist / history never sit under the floating bottom bar */
body.full.showbar .side,body.ah:not(.full):not(.idle) .side{bottom:var(--barh,76px)}
body.full .side{border-bottom:0}
/* fullscreen: top and bottom bars slide away, mouse to the top / bottom edge brings them back */
.full #top{position:absolute;top:0;left:0;right:0;z-index:40;transform:translateY(-100%);transition:transform .18s}
.full.showtop #top{transform:none}
.full #bar{transform:translateY(calc(100% + 28px));transition:transform .18s,opacity .25s}
.full #top{-webkit-app-region:no-drag}.full.showtop .side{top:32px}/* no drag area in fullscreen, so a double click on the title bar reaches the page (leaves fullscreen, see desktop.js) */
.full.showbar #bar{transform:none}
#sk{display:flex;align-items:center;gap:10px}
.tt{font-size:12px;color:var(--fg2);min-width:42px;font-variant-numeric:tabular-nums}#t2{text-align:right}
#tlw{flex:1;position:relative;height:16px;display:flex;align-items:center;cursor:pointer}
#tl{width:100%;height:4px;background:var(--trk);position:relative}
#fill{height:100%;background:var(--ac);width:0}
#tlw:hover #tl{height:6px}
#tlw .bmk{position:absolute;top:-20px;width:16px;height:36px;margin-left:-8px;cursor:pointer;z-index:3}
#tlw .bmk svg{position:absolute;left:1px;top:0;width:14px;height:18px;color:var(--ac);filter:drop-shadow(0 1px 1px rgba(0,0,0,.55));transition:transform .12s;transform-origin:50% 100%;pointer-events:none}
#tlw .bmk::after{content:'';position:absolute;left:7px;bottom:2px;width:2px;height:12px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#tlw .bmk:hover svg{transform:scale(1.25)}
#prev{position:absolute;bottom:22px;display:none;background:var(--inp);border:1px solid var(--bd2);border-radius:3px;padding:3px;text-align:center;font-size:12px;transform:translateX(-50%);pointer-events:none}
#prev canvas{width:160px;height:90px;display:block;background:#000}
.btns{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-top:2px}
.btns button{background:none;border:0;color:var(--fg);font-size:12px;font-weight:600;padding:5px 7px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:30px}
.btns button:hover{background:var(--bg3);color:var(--fgh)}
.btns button.on{color:var(--ac)}
.btns{flex-wrap:nowrap;overflow:hidden}.btns button{flex:none}/* one row only: the window's minimum width is set so that every visible button fits (desktop.js fitMin) */
.ic{width:18px;height:18px;flex:none;display:block}.ic.f{fill:currentColor}
.sp{flex:1}
#pop{position:absolute;z-index:14;right:10px;bottom:10px;min-width:220px;max-width:320px;max-height:60%;overflow:auto;background:var(--bg1);border:1px solid var(--bd);border-radius:4px;padding:10px;display:none}
#pop h4{margin:0 0 8px;font-size:13px;color:var(--fg3)}
#pop[data-k=sub],#pop[data-k=aud]{right:auto;left:10px}
#pop.sp{width:348px;max-width:94%;padding:0;max-height:calc(100% - 96px)}
.sp .sh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:14px;color:var(--fgh)}.sp .sh .ic{width:17px;height:17px;color:var(--ac)}.sp .sh span{flex:1}
.sp .sec{padding:8px 14px 10px;border-top:1px solid var(--bd)}.sp .sec:first-of-type{border-top:0}
.sp .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
.sp .tk{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--fg)}
.sp .tk:hover{background:var(--bg2)}.sp .tk .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg3);flex:none;display:flex;align-items:center;justify-content:center}
.sp .tk.on{color:var(--ac)}.sp .tk.on .rd{border-color:var(--ac)}.sp .tk.on .rd::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--ac)}
.sp .tk .ob{margin-left:auto;align-self:center;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--ac);color:#fff}
.sp .onr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px 10px;color:var(--fgh);font-weight:600}.sp .onr small{display:block;font-weight:400;color:var(--fg3);font-size:11.5px;margin-top:1px}
.sp .onr.on small{color:var(--ac)}
.sp .onr>div:first-child{flex:1 1 auto;min-width:0}.sp .onr .sw{flex:0 0 auto}
.sp .ab button{white-space:nowrap}
.sp .tk>div{min-width:0}.sp .tk>div>div,.sp .tk small,.sp .onr small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .tk small{display:block;color:var(--fg3);font-size:11.5px;margin-top:1px}.sp .tk.dis{opacity:.5;cursor:default}
.sp .ch{display:flex;gap:6px;flex-wrap:wrap}
.sp .ch button,.sp .ab button,.sp .sx button{background:var(--bg2);color:var(--fg);border:1px solid var(--bd2);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.sp .ch button:hover,.sp .ab button:hover,.sp .sx button:hover{border-color:var(--ac);color:var(--fgh)}
.sp .ch button.on{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.sp .ab{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.sp .ab .ic,.sp .sx .ic{width:14px;height:14px}
.sp .sw2{display:flex;gap:10px;align-items:center}
.sp .sw2 b{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.sp .sw2 b.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--ac)}
.sp .sw2 input{width:30px;height:26px;padding:0;border:1px solid var(--bd2);border-radius:6px;background:none;cursor:pointer}
.sp .sx{display:flex;align-items:center;gap:6px}.sp .sx output{min-width:68px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fgh);font-weight:600}
.sp .sx button.sq{width:32px;height:30px;padding:0;justify-content:center;font-size:16px;line-height:1;border-radius:8px}
.sp .sx .gap{flex:1}
.sp .sr2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}.sp .sr2>span{color:var(--fg2)}
.sp-pv{height:62px;border-radius:10px;margin:2px 0 12px;background:linear-gradient(135deg,#3b4a5a,#6b5a4a 55%,#2a3340);display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;overflow:hidden;position:relative}
.sp-pv span{font-size:18px;color:var(--sc);font-weight:600;background:var(--sb);padding:.05em .4em;border-radius:.15em;font-family:var(--sf,inherit)}
.sp .ft{position:sticky;bottom:0;background:var(--bg1);padding:9px 14px 11px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp .ft button{background:none;border:0;color:var(--fg2);cursor:pointer;font:inherit;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px}.sp .ft button:hover{color:var(--fgh);background:var(--bg2)}.sp .ft .ic{width:14px;height:14px}

#pop[data-k=ctx]{min-width:0;width:280px;max-width:280px;padding:6px;font-size:13px}
#pop[data-k=ctx] h4{margin:6px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#pop[data-k=ctx] label{margin:3px 4px;gap:6px}
#pop[data-k=ctx] input[type=range]{width:130px!important}
#pop[data-k=ctx] .r{padding:5px 8px}
#pop .r{padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#pop .r:hover{background:var(--bg2)}#pop .r.sel{color:var(--ac)}
#pop label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
